<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bearingSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Outer Race Ring (Deep Groove Ball Bearing 6201-2RS) -->
  <circle cx="60" cy="60" r="46" fill="url(#bearingSteel)" stroke="#334155" stroke-width="2"/>
  <!-- Rubber Seal Lip Ring (Blue 2RS Seal) -->
  <circle cx="60" cy="60" r="41" fill="none" stroke="#0284c7" stroke-width="3"/>

  <!-- Ball Bearing Cage Track -->
  <circle cx="60" cy="60" r="32" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Chrome Steel Precision Balls (8 Balls) -->
  <circle cx="60" cy="28" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="60" cy="92" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="60" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="92" cy="60" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="37" cy="37" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="83" cy="37" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="37" cy="83" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>
  <circle cx="83" cy="83" r="7" fill="url(#ballShine)" stroke="#1e293b" stroke-width="1"/>

  <!-- Inner Race Ring -->
  <circle cx="60" cy="60" r="22" fill="url(#bearingSteel)" stroke="#334155" stroke-width="2"/>
  <!-- Inner Bore Hole (Shaft Hole) -->
  <circle cx="60" cy="60" r="14" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
</svg>