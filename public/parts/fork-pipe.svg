<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="65%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Left Fork Inner Pipe (Chrome Plated) -->
  <rect x="36" y="16" width="14" height="62" rx="3" fill="url(#chromeGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Left Outer Slider Leg -->
  <rect x="32" y="74" width="22" height="32" rx="4" fill="url(#sliderGrad)" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Left Fork Bottom Axle Lug -->
  <circle cx="43" cy="98" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>

  <!-- Right Fork Inner Pipe (Chrome Plated) -->
  <rect x="70" y="16" width="14" height="62" rx="3" fill="url(#chromeGrad)" stroke="#475569" stroke-width="1"/>
  <!-- Right Outer Slider Leg -->
  <rect x="66" y="74" width="22" height="32" rx="4" fill="url(#sliderGrad)" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Right Fork Bottom Axle Lug -->
  <circle cx="77" cy="98" r="5" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>

  <!-- Dust Boots / Rubber Gaiter Rings -->
  <rect x="34" y="68" width="18" height="6" rx="1" fill="#0f172a"/>
  <rect x="68" y="68" width="18" height="6" rx="1" fill="#0f172a"/>

  <!-- Top Triple Clamp Brace Hint -->
  <path d="M30 24 L90 24" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
</svg>