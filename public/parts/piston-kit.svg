<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pistonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="40%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Piston Crown & Body -->
  <path d="M28 32 C28 26 36 22 60 22 C84 22 92 26 92 32 L92 84 C92 88 88 92 84 92 L76 92 C72 86 68 86 60 86 C52 86 48 92 44 92 L36 92 C32 92 28 88 28 84 Z" 
        fill="url(#pistonGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Piston Ring Grooves (Top Compression, Second, Oil Ring) -->
  <line x1="28" y1="36" x2="92" y2="36" stroke="#1e293b" stroke-width="2"/>
  <line x1="28" y1="42" x2="92" y2="42" stroke="#1e293b" stroke-width="2"/>
  <line x1="28" y1="48" x2="92" y2="48" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Gudgeon Pin / Wrist Pin Bore Hole -->
  <circle cx="60" cy="66" r="14" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <circle cx="60" cy="66" r="9" fill="url(#pinGrad)"/>

  <!-- Piston Rings floating around (Indicates Kit) -->
  <ellipse cx="60" cy="18" rx="36" ry="6" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="16 3"/>
  <ellipse cx="60" cy="102" rx="34" ry="6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="14 3"/>
</svg>