<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cableSheath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="innerWire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Coiled Outer PVC Protective Sheath / Housing -->
  <circle cx="56" cy="64" r="34" fill="none" stroke="url(#cableSheath)" stroke-width="8"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Cable End Metal Ferrule & Threaded Adjuster Nut -->
  <rect x="74" y="16" width="18" height="10" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <rect x="80" y="24" width="6" height="16" rx="1" fill="#64748b"/>
  <!-- Knurled Adjuster Wheel -->
  <line x1="76" y1="21" x2="90" y2="21" stroke="#475569" stroke-width="1"/>

  <!-- Braided Stainless Steel Inner Wire (Exposed End) -->
  <path d="M83 16 L83 6" stroke="url(#innerWire)" stroke-width="3" stroke-linecap="round"/>
  <!-- Lead Barrel Nipple (Clutch / Throttle Lever End) -->
  <rect x="78" y="2" width="10" height="6" rx="2" fill="#ca8a04" stroke="#854d0e" stroke-width="1"/>

  <!-- Protective Rubber Dust Boot Accordion -->
  <ellipse cx="83" cy="38" rx="6" ry="3" fill="#0f172a"/>
  <ellipse cx="83" cy="42" rx="7" ry="3" fill="#0f172a"/>
  <ellipse cx="83" cy="46" rx="6" ry="3" fill="#0f172a"/>
</svg>