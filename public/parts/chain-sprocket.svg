<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sprocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="chainGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Large Rear Sprocket Wheel -->
  <circle cx="56" cy="60" r="38" fill="url(#sprocketGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Sprocket Teeth (Points) -->
  <circle cx="56" cy="60" r="42" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="6 4"/>

  <!-- Sprocket Lightening Cutout Holes -->
  <circle cx="56" cy="60" r="16" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/>
  <circle cx="56" cy="36" r="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="56" cy="84" r="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="32" cy="60" r="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="80" cy="60" r="6" fill="#f8fafc" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Golden Heavy-Duty Drive Chain Links -->
  <!-- Top Link Row -->
  <g fill="url(#chainGold)" stroke="#92400e" stroke-width="1">
    <rect x="68" y="20" width="14" height="8" rx="3"/>
    <circle cx="71" cy="24" r="1.5" fill="#1e293b"/>
    <circle cx="79" cy="24" r="1.5" fill="#1e293b"/>

    <rect x="80" y="26" width="14" height="8" rx="3"/>
    <circle cx="83" cy="30" r="1.5" fill="#1e293b"/>
    <circle cx="91" cy="30" r="1.5" fill="#1e293b"/>

    <rect x="90" y="34" width="14" height="8" rx="3"/>
    <circle cx="93" cy="38" r="1.5" fill="#1e293b"/>
    <circle cx="101" cy="38" r="1.5" fill="#1e293b"/>

    <rect x="94" y="46" width="14" height="8" rx="3"/>
    <circle cx="97" cy="50" r="1.5" fill="#1e293b"/>
    <circle cx="105" cy="50" r="1.5" fill="#1e293b"/>
  </g>
</svg>