<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="hornDome" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="chromeRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Steel Mounting Bracket Plate (Top Right) -->
  <path d="M58 24 L88 16 C92 15 96 18 96 22 L96 34 L72 38 Z" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="86" cy="24" r="4.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Outer Chrome Trim Ring (Bezel) -->
  <circle cx="56" cy="64" r="44" fill="url(#chromeRing)" stroke="#334155" stroke-width="2"/>

  <!-- Horn Acoustic Diaphragm Resonator Shell -->
  <circle cx="56" cy="64" r="38" fill="url(#hornDome)" stroke="#020617" stroke-width="2"/>

  <!-- Radial Acoustic Sound Slits / Grille Openings -->
  <circle cx="56" cy="64" r="30" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="10 6"/>
  <circle cx="56" cy="64" r="20" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Center Chrome Dome Button -->
  <circle cx="56" cy="64" r="10" fill="url(#chromeRing)" stroke="#334155" stroke-width="1.5"/>
  <circle cx="56" cy="64" r="4" fill="#0f172a"/>

  <!-- Electrical Spade Contacts -->
  <rect x="88" y="76" width="12" height="6" rx="1" fill="#ca8a04"/>
  <rect x="88" y="86" width="12" height="6" rx="1" fill="#ca8a04"/>
</svg>