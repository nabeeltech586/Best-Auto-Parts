<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="oilBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldOil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Bottle Cap -->
  <rect x="44" y="16" width="18" height="10" rx="2" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="48" y1="18" x2="48" y2="24" stroke="#ca8a04" stroke-width="1"/>
  <line x1="53" y1="18" x2="53" y2="24" stroke="#ca8a04" stroke-width="1"/>
  <line x1="58" y1="18" x2="58" y2="24" stroke="#ca8a04" stroke-width="1"/>

  <!-- Bottle Neck -->
  <path d="M47 26 L59 26 L64 36 L42 36 Z" fill="#991b1b"/>

  <!-- Bottle Handle & Body -->
  <path d="M34 38 C34 36 38 36 42 36 L74 36 C80 36 86 42 86 48 L86 96 C86 100 82 104 78 104 L34 104 C30 104 26 100 26 96 L26 46 C26 40 30 38 34 38 Z" 
        fill="url(#oilBottle)" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Ergonomic Side Handle Hole -->
  <path d="M32 48 C32 44 38 44 42 46 L42 78 C38 80 32 80 32 76 Z" fill="#f8fafc" stroke="#7f1d1d" stroke-width="1.5"/>

  <!-- Front Label -->
  <rect x="46" y="50" width="34" height="42" rx="4" fill="#1e293b"/>
  <!-- Gold Oil Drop Icon -->
  <path d="M63 56 C63 56 56 66 56 71 C56 75 59 78 63 78 C67 78 70 75 70 71 C70 66 63 56 63 56 Z" fill="url(#goldOil)"/>
  <!-- Viscosity Grade Text -->
  <text x="63" y="86" font-family="Arial,sans-serif" font-size="6.5" font-weight="900" fill="#f8fafc" text-anchor="middle">20W-50</text>
  <text x="63" y="91" font-family="Arial,sans-serif" font-size="4.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">4T PLUS</text>

  <!-- Level Indicator Sight Window -->
  <rect x="80" y="44" width="3" height="54" rx="1.5" fill="#fef08a"/>
</svg>