<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="switchBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="brassKey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="#f8fafc"/>
  <rect x="2" y="2" width="116" height="116" rx="18" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Fuel Cap Outer Ring -->
  <circle cx="74" cy="46" r="24" fill="url(#capGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="74" cy="46" r="16" fill="#1e293b"/>
  <!-- Key Slot -->
  <rect x="71" y="40" width="6" height="12" rx="1" fill="#64748b"/>
  <line x1="74" y1="42" x2="74" y2="50" stroke="#0f172a" stroke-width="2"/>

  <!-- Ignition Lock Cylinder -->
  <rect x="22" y="52" width="34" height="42" rx="6" fill="url(#switchBody)" stroke="#0f172a" stroke-width="2"/>
  <rect x="26" y="44" width="26" height="10" rx="3" fill="url(#capGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="36" y="46" width="6" height="6" rx="1" fill="#0f172a"/>

  <!-- Keys & Keyring -->
  <circle cx="48" cy="88" r="10" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <!-- Key 1 -->
  <path d="M48 88 L68 98 L72 96 L74 98 L76 96 L82 100 L76 104 L48 88 Z" fill="url(#brassKey)" stroke="#a16207" stroke-width="1"/>
  <!-- Wiring Harness Plug -->
  <rect x="30" y="92" width="18" height="14" rx="2" fill="#0284c7"/>
  <line x1="34" y1="106" x2="34" y2="114" stroke="#ef4444" stroke-width="2"/>
  <line x1="39" y1="106" x2="39" y2="114" stroke="#22c55e" stroke-width="2"/>
  <line x1="44" y1="106" x2="44" y2="114" stroke="#0f172a" stroke-width="2"/>
